# DriftGuard Cloud Deployment Blueprint (Render.com)
# Lightweight, high-reliability interactive demonstration for hackathon judges.
#
# Architecture:
# 1. Interactive Demo API Service:
#    - FastAPI lightweight runner on Render free tier (uses <50MB RAM, 0 cloud spend)
#    - Serves verified contract scenarios, live RED-to-GREEN reconciliation runs, and Studio responses
# 2. Command Center Dashboard:
#    - React + Vite + AG Grid static site on Render global CDN (instant load, 0 cold start)

services:
  # ============================================================================
  # 1. Interactive Demo API Service (FastAPI)
  # ============================================================================
  - type: web
    name: driftguard-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r mock_runner/requirements.txt
    startCommand: uvicorn mock_runner.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DRIFTGUARD_CORS_ORIGINS
        value: https://driftguard-dashboard.onrender.com,http://localhost:5173,http://localhost:3000

  # ============================================================================
  # 2. Command Center Dashboard (Vite + React + AG Grid)
  # ============================================================================
  - type: web
    name: driftguard-dashboard
    runtime: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://driftguard-api.onrender.com
      - key: VITE_AI_URL
        value: https://driftguard-api.onrender.com
