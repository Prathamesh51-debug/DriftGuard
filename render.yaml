# DriftGuard Cloud Deployment Blueprint (Render.com)
# Planner Ref: Part 2 & Part 7 (Role A - Render Deploy Blueprint)
# 
# Services:
# 1. PostgreSQL Managed Database (Job queue & persistence)
# 2. DriftGuard Engine API (FastAPI backend + runner endpoints)
# 3. DriftGuard Worker (Async job consumer using SKIP LOCKED queue)
# 4. DriftGuard Dashboard (React + Vite + AG Grid command center)

databases:
  - name: driftguard-db
    databaseName: driftguard
    user: driftguard
    plan: free
    region: oregon

services:
  # ============================================================================
  # 1. Core Engine API (FastAPI)
  # ============================================================================
  - type: web
    name: driftguard-engine
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r engine/requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn engine.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driftguard-db
          property: connectionString
      - key: PYTHONPATH
        value: .
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DRIFTGUARD_CORS_ORIGINS
        value: https://driftguard-dashboard.onrender.com

  # ============================================================================
  # 2. Concurrency-Safe Orchestrator Worker (SKIP LOCKED consumer)
  # ============================================================================
  - type: worker
    name: driftguard-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r engine/requirements.txt && playwright install --with-deps chromium
    startCommand: python engine/orchestrator/worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driftguard-db
          property: connectionString
      - key: PYTHONPATH
        value: .
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false

  # ============================================================================
  # 3. Dashboard Command Center (Vite + React + AG Grid)
  # ============================================================================
  - type: web
    name: driftguard-dashboard
    runtime: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://driftguard-engine.onrender.com

